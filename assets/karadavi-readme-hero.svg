<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">KARADAVI — The knowledge architecture</title>
  <desc id="desc">A quiet editorial landscape inspired by the KARADAVI website, with forest green typography, subtle contour lines and a knowledge forest horizon.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F1"/>
      <stop offset="1" stop-color="#EEF2EC"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B6C6AE"/>
      <stop offset="0.5" stop-color="#D5C79D"/>
      <stop offset="1" stop-color="#9FAF8E"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#paper)"/>
  <g fill="none" stroke="#C8D1C8" stroke-width="2" opacity="0.7">
    <ellipse cx="700" cy="305" rx="820" ry="270"/>
    <ellipse cx="700" cy="305" rx="690" ry="225"/>
    <ellipse cx="700" cy="305" rx="555" ry="182"/>
    <ellipse cx="700" cy="305" rx="425" ry="142"/>
    <ellipse cx="700" cy="305" rx="300" ry="102"/>
  </g>
  <g fill="#184D3A" opacity="0.08" filter="url(#soft)">
    <circle cx="1120" cy="190" r="110"/>
    <circle cx="290" cy="350" r="90"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#184D3A">
    <text x="92" y="116" font-size="64" font-weight="700" letter-spacing="5">KARADAVI</text>
    <text x="96" y="157" font-size="16" font-weight="700" letter-spacing="4">THE KNOWLEDGE ARCHITECTURE</text>
    <text x="96" y="232" font-size="42" font-weight="700">Understand anything.</text>
    <text x="96" y="282" font-size="42" font-weight="700">Follow where it <tspan font-style="italic">leads.</tspan></text>
    <rect x="96" y="325" width="330" height="46" rx="23" fill="#E9EFEA" stroke="#9EB9AA"/>
    <circle cx="120" cy="348" r="5"/>
    <text x="138" y="354" font-size="17" letter-spacing="3">A QUIET LIBRARY FOR THE INTERNET</text>
  </g>
  <path d="M0 485 C150 455 245 470 355 440 C470 409 575 456 690 430 C825 399 930 458 1040 423 C1160 385 1260 420 1400 382 L1400 560 L0 560 Z" fill="url(#horizon)" opacity="0.95"/>
  <path d="M0 510 C170 470 270 500 400 466 C540 430 610 488 760 454 C900 422 1020 480 1150 444 C1250 416 1320 444 1400 426 L1400 560 L0 560 Z" fill="#6E8662" opacity="0.72"/>
  <g fill="#315C42" opacity="0.82">
    <circle cx="135" cy="494" r="18"/><circle cx="180" cy="482" r="25"/><circle cx="238" cy="500" r="16"/>
    <circle cx="480" cy="468" r="22"/><circle cx="530" cy="482" r="16"/><circle cx="810" cy="470" r="24"/>
    <circle cx="1010" cy="455" r="18"/><circle cx="1080" cy="474" r="28"/><circle cx="1260" cy="448" r="22"/>
  </g>
  <g fill="#F4F1E7" opacity="0.9">
    <rect x="300" y="480" width="28" height="23"/><path d="M294 480 L314 460 L334 480Z"/>
    <rect x="1180" y="455" width="30" height="25"/><path d="M1174 455 L1195 433 L1216 455Z"/>
  </g>
  <rect x="96" y="421" width="236" height="52" rx="10" fill="#F3E5C8" stroke="#D6B77A"/>
  <text x="118" y="445" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#184D3A">KARADAVI</text>
  <text x="118" y="464" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#5E665F">The Knowledge Forest</text>
</svg>
