<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How the KARADAVI knowledge forest works</title>
  <desc id="desc">Four sequential KARADAVI knowledge forest stages: Discover, Research, Extract, and Connect.</desc>

  <rect width="1200" height="1040" rx="28" fill="#F8F8F6"/>

  <text x="72" y="72" fill="#214F43" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="4">THE KNOWLEDGE FOREST</text>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <!-- 01 / DISCOVER -->
    <rect x="48" y="112" width="1104" height="190" rx="28" fill="#FFFFFF" stroke="#E5E6E2" stroke-width="2"/>
    <text x="82" y="158" fill="#214F43" font-size="18" font-weight="700" letter-spacing="3">01</text>
    <text x="1118" y="158" text-anchor="end" fill="#66716D" font-size="17" font-weight="700" letter-spacing="2">DISCOVER</text>
    <text x="82" y="210" fill="#5F625F" font-size="26" font-weight="400">Identify emerging subjects, entities, and</text>
    <text x="82" y="250" fill="#5F625F" font-size="26" font-weight="400">historical inflection points across tech,</text>
    <text x="82" y="290" fill="#5F625F" font-size="26" font-weight="400">science, and industry.</text>

    <!-- 02 / RESEARCH -->
    <rect x="48" y="330" width="1104" height="190" rx="28" fill="#FFFFFF" stroke="#E5E6E2" stroke-width="2"/>
    <text x="82" y="376" fill="#214F43" font-size="18" font-weight="700" letter-spacing="3">02</text>
    <text x="1118" y="376" text-anchor="end" fill="#66716D" font-size="17" font-weight="700" letter-spacing="2">RESEARCH</text>
    <text x="82" y="428" fill="#5F625F" font-size="26" font-weight="400">Aggregate verified primary sources, SEC</text>
    <text x="82" y="468" fill="#5F625F" font-size="26" font-weight="400">filings, patents, court records, and peer-</text>
    <text x="82" y="508" fill="#5F625F" font-size="26" font-weight="400">reviewed literature.</text>

    <!-- 03 / EXTRACT -->
    <rect x="48" y="548" width="1104" height="190" rx="28" fill="#FFFFFF" stroke="#E5E6E2" stroke-width="2"/>
    <text x="82" y="594" fill="#214F43" font-size="18" font-weight="700" letter-spacing="3">03</text>
    <text x="1118" y="594" text-anchor="end" fill="#66716D" font-size="17" font-weight="700" letter-spacing="2">EXTRACT</text>
    <text x="82" y="646" fill="#5F625F" font-size="26" font-weight="400">Parse canonical facts, key dates, attributes,</text>
    <text x="82" y="686" fill="#5F625F" font-size="26" font-weight="400">and structured assertions into the entity</text>
    <text x="82" y="726" fill="#5F625F" font-size="26" font-weight="400">registry.</text>

    <!-- 04 / CONNECT -->
    <rect x="48" y="766" width="1104" height="190" rx="28" fill="#FFFFFF" stroke="#E5E6E2" stroke-width="2"/>
    <text x="82" y="812" fill="#214F43" font-size="18" font-weight="700" letter-spacing="3">04</text>
    <text x="1118" y="812" text-anchor="end" fill="#66716D" font-size="17" font-weight="700" letter-spacing="2">CONNECT</text>
    <text x="82" y="864" fill="#5F625F" font-size="26" font-weight="400">Map bidirectional graph relationships linking</text>
    <text x="82" y="904" fill="#5F625F" font-size="26" font-weight="400">people, companies, technologies, and</text>
    <text x="82" y="944" fill="#5F625F" font-size="26" font-weight="400">concepts.</text>
  </g>

  <path d="M72 1000H1128" stroke="#DDE0DC" stroke-width="2"/>
</svg>
