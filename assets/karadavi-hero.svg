<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">KARADAVI — Machine trust, perception, semantic authority</title>
  <desc id="desc">A dark technical field with cyan, violet, magenta and amber signals flowing through a machine trust network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B17"/>
      <stop offset="0.45" stop-color="#111A38"/>
      <stop offset="1" stop-color="#210D2D"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.38" stop-color="#7C5CFF"/>
      <stop offset="0.7" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="glowC"><stop stop-color="#00E5FF" stop-opacity=".55"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP"><stop stop-color="#FF4FD8" stop-opacity=".42"/><stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="34" fill="url(#grid)"/>
  <circle cx="220" cy="120" r="230" fill="url(#glowC)" filter="url(#blur)"/>
  <circle cx="1370" cy="500" r="260" fill="url(#glowP)" filter="url(#blur)"/>
  <path d="M0 475 C260 350 390 530 650 405 S1090 250 1600 365" fill="none" stroke="url(#flow)" stroke-width="3" opacity=".9"/>
  <path d="M40 515 C330 395 470 560 710 445 S1110 300 1560 405" fill="none" stroke="url(#flow)" stroke-width="1" opacity=".35"/>
  <g fill="#0B1023" stroke="url(#flow)" stroke-width="2">
    <circle cx="270" cy="424" r="14"/><circle cx="530" cy="465" r="14"/><circle cx="790" cy="377" r="14"/><circle cx="1060" cy="318" r="14"/><circle cx="1335" cy="350" r="14"/>
  </g>
  <g fill="#fff">
    <circle cx="270" cy="424" r="4"/><circle cx="530" cy="465" r="4"/><circle cx="790" cy="377" r="4"/><circle cx="1060" cy="318" r="4"/><circle cx="1335" cy="350" r="4"/>
  </g>
  <g opacity=".9">
    <rect x="110" y="92" width="1380" height="1" fill="#FFFFFF" opacity=".12"/>
    <rect x="110" y="510" width="1380" height="1" fill="#FFFFFF" opacity=".12"/>
  </g>
  <text x="110" y="170" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="8">KARADAVI</text>
  <text x="114" y="220" fill="#AEBBFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">MACHINE TRUST · PERCEPTION · SEMANTIC AUTHORITY</text>
  <text x="114" y="292" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">Make the reasoning behind trust inspectable.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">
    <rect x="114" y="535" width="184" height="42" rx="21" fill="#00E5FF"/><text x="206" y="562" text-anchor="middle" fill="#06111A">PERCEPTION</text>
    <rect x="312" y="535" width="170" height="42" rx="21" fill="#7C5CFF"/><text x="397" y="562" text-anchor="middle" fill="#FFFFFF">EVIDENCE</text>
    <rect x="496" y="535" width="176" height="42" rx="21" fill="#FF4FD8"/><text x="584" y="562" text-anchor="middle" fill="#FFFFFF">AUTHORITY</text>
    <rect x="686" y="535" width="145" height="42" rx="21" fill="#FFB347"/><text x="758" y="562" text-anchor="middle" fill="#241305">TRUST</text>
  </g>
  <text x="1490" y="565" text-anchor="end" fill="#9AA5C7" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">PUBLIC RESEARCH · v0.1</text>
</svg>